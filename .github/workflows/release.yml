name: Release verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Offline source and wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.14"]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/workdesk/package-lock.json
      - name: Build workdesk from locked dependencies
        run: |
          npm --prefix frontend/workdesk ci --no-audit --no-fund
          npm --prefix frontend/workdesk run build -- --configLoader runner
      - name: Install explicit packaging tools
        run: python -m pip install build==1.3.0 setuptools==80.9.0 wheel==0.45.1
      - name: Verify source archive, packaged tests, sdist rebuild and isolated wheel
        run: python tools/check_release.py --wheel
