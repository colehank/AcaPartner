name: Backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.14"]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install backend development tools
        run: python -m pip install -e '.[dev]'
      - name: Check backend syntax and undefined names
        run: python -m ruff check --select E9,F63,F7,F82 research_partner tools tests
      - name: Check maintained backend modules
        run: >-
          python -m ruff check
          research_partner/action_contract.py research_partner/diagnostics.py
          research_partner/process_output.py research_partner/provider_availability.py
          tests
      - name: Check maintained backend formatting
        run: >-
          python -m ruff format --check
          research_partner/action_contract.py research_partner/diagnostics.py
          research_partner/process_output.py research_partner/provider_availability.py
          tests
      - name: Run backend unit tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -t . -v
