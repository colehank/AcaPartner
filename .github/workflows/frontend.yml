name: Frontend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/workdesk/package-lock.json
      - name: Install locked frontend dependencies
        run: npm --prefix frontend/workdesk ci --no-audit --no-fund
      - name: Build workdesk
        run: npm --prefix frontend/workdesk run build -- --configLoader runner
      - name: Install test browser
        working-directory: frontend/workdesk
        run: npx --no-install playwright install --with-deps chromium
      - name: Run isolated browser contracts
        run: npm --prefix frontend/workdesk test
