[build-system]
requires = ["setuptools>=68"]
build-backend = "tools.package_resources"
backend-path = ["."]

[project]
name = "research-partner"
version = "0.1.0.dev0"
description = "Self-hosted research objects, scholarly editing and bounded agent collaboration"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.14.14", "mypy==1.18.2"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[project.scripts]
research-partner = "research_partner.__main__:main"

[tool.setuptools]
include-package-data = false
package-dir = {"" = "src"}

[tool.setuptools.cmdclass]
build_py = "tools.package_resources.AssembleBuildPy"
sdist = "tools.package_resources.AssembleSdist"

[tool.setuptools.packages.find]
where = ["src"]
include = ["research_partner", "research_partner.*"]
namespaces = false

[tool.setuptools.package-data]
research_partner = ["resources/*", "resources/**/*"]

[tool.setuptools.exclude-package-data]
research_partner = ["resources/web/legacy/tests/*", "resources/web/legacy/tests/**/*"]
