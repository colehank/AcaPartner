[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-partner"
version = "0.1.0.dev0"
description = "Self-hosted research objects, scholarly editing and bounded agent collaboration"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
runtime = ["psutil==7.2.2; sys_platform == 'darwin'"]

[project.scripts]
research-partner = "research_partner.__main__:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["research_partner", "research_partner.*"]
namespaces = false

[tool.setuptools.package-data]
research_partner = ["web/*", "web/**/*", "native/*", "fonts/DejaVuSans.ttf", "fonts/DejaVuSans.LICENSE", "fonts/NotoSansMath-Regular.ttf", "fonts/NotoSansMath.LICENSE", "fonts/NotoEmoji-Variable.ttf", "fonts/NotoEmoji.LICENSE", "runtime-features.json"]

[tool.setuptools.exclude-package-data]
research_partner = ["web/tests/*", "web/tests/**/*"]
